name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 语法检查
        run: bash -n cswitch install.sh lib/*.sh
      - name: 版本文件校验
        run: python3 -c "import json; v=json.load(open('VERSION'))['message']; assert v"
      - name: 冒烟测试
        run: |
          ./cswitch version
          ./cswitch help >/dev/null
